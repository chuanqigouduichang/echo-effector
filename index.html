<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#13131f">
<title>回声效果器</title>
<link rel="manifest" href="manifest.json">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#13131f;--surface:rgba(30,30,50,0.9);--border:rgba(139,92,246,0.15);
    --accent:#8b5cf6;--accent-bright:#a78bfa;--secondary:#6366f1;
    --glow:rgba(139,92,246,0.2);--text:#f0f0f5;--dim:#8a8fa0;
    --danger:#ef4444;--success:#10b981;--radius:12px
  }
  html,body{height:100%;overflow:hidden}
  body{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
    background-color:var(--bg);
    color:var(--text);display:flex;flex-direction:column;
  }
  body::before{
    content:'';position:fixed;top:-25%;left:50%;transform:translateX(-50%);
    width:50vw;height:50vw;
    background:radial-gradient(ellipse,rgba(139,92,246,0.04) 0%,rgba(139,92,246,0.015) 40%,transparent 70%);
    pointer-events:none;
    animation:glowPulse 6s ease-in-out infinite;
  }
  body::after{
    content:'';position:fixed;bottom:-15%;right:-5%;
    width:40vw;height:40vw;
    background:radial-gradient(ellipse,rgba(99,102,241,0.03) 0%,rgba(99,102,241,0.01) 40%,transparent 70%);
    pointer-events:none;
    animation:glowPulse2 7s ease-in-out infinite;
  }
  @keyframes glowPulse{
    0%,100%{opacity:0.5;transform:translateX(-50%) scale(1)}
    50%{opacity:0.8;transform:translateX(-50%) scale(1.04)}
  }
  @keyframes glowPulse2{
    0%,100%{opacity:0.4;transform:scale(1)}
    50%{opacity:0.7;transform:scale(1.03)}
  }

  .app{flex:1;display:flex;flex-direction:column;max-width:600px;width:100%;margin:0 auto;padding:6px 10px;gap:6px;overflow-y:auto;position:relative;z-index:1}

  .card{
    background:var(--surface);
    backdrop-filter:blur(20px) saturate(1.1);-webkit-backdrop-filter:blur(20px) saturate(1.1);
    border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;
    box-shadow:0 2px 12px rgba(0,0,0,0.2);
    transition:border-color .25s;
  }
  .card:hover{
    border-color:rgba(139,92,246,0.22);
  }

  .header{text-align:center;padding:10px 14px}
  .header h1{
    font-size:18px;font-weight:700;letter-spacing:-0.3px;
    background:linear-gradient(135deg,#c4b5fd 0%,#a78bfa 40%,#8b5cf6 70%,#6366f1 100%);
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  }

  .upload-zone{border:1.5px dashed var(--border);border-radius:var(--radius);padding:16px 12px;text-align:center;cursor:pointer;transition:.25s}
  .upload-zone:hover,.upload-zone.drag-over{border-color:var(--accent-bright);background:rgba(139,92,246,.06)}
  .upload-zone .icon{display:block;margin-bottom:4px;opacity:.5}
  .upload-zone .icon svg{width:24px;height:24px;stroke:var(--dim);stroke-width:1.5;fill:none}
  .upload-zone .label{font-size:13px;font-weight:600;margin:2px 0}
  .upload-zone .hint{font-size:11px;color:var(--dim)}
  .upload-zone input{display:none}

  .file-info{display:flex;align-items:center;gap:8px;padding:8px 12px;background:rgba(139,92,246,.06);border-radius:10px}
  .file-info .file-icon{width:16px;height:16px;stroke:var(--dim);stroke-width:1.5;fill:none;flex-shrink:0}
  .file-info .name{flex:1;font-size:12px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .file-info .meta{font-size:10px;color:var(--dim);white-space:nowrap}
  .file-info .remove{cursor:pointer;opacity:.5;font-size:14px;transition:.25s;color:var(--dim);line-height:1}
  .file-info .remove:hover{opacity:1;color:var(--danger)}

  .params{display:flex;flex-direction:column;gap:10px}

  .presets{display:flex;gap:6px;flex-wrap:wrap}
  .preset-btn{
    font-family:inherit;font-size:11px;font-weight:600;
    padding:5px 12px;border-radius:20px;border:1px solid var(--border);
    background:rgba(255,255,255,.03);color:var(--dim);cursor:pointer;
    transition:all .2s;white-space:nowrap;
  }
  .preset-btn:hover{border-color:rgba(139,92,246,0.3);color:var(--text)}
  .preset-btn.active{background:rgba(139,92,246,.15);border-color:var(--accent);color:var(--accent-bright)}

  .param-row{display:flex;flex-direction:column;gap:4px}
  .param-label{display:flex;justify-content:space-between;align-items:baseline;font-size:11px;font-weight:600;color:var(--dim)}
  .param-label .value{font-family:'SF Mono',Consolas,monospace;font-size:13px;font-weight:700;color:var(--accent-bright);min-width:52px;text-align:right}

  input[type="range"]{-webkit-appearance:none;appearance:none;width:100%;height:5px;border-radius:3px;background:rgba(255,255,255,.07);outline:none;transition:background .2s}
  input[type="range"]::-webkit-slider-thumb{
    -webkit-appearance:none;appearance:none;width:20px;height:20px;border-radius:50%;
    background:var(--accent);
    box-shadow:0 0 10px rgba(139,92,246,0.35),0 0 4px rgba(139,92,246,0.2);
    cursor:pointer;border:2px solid rgba(167,139,250,0.35);
    transition:box-shadow .2s,transform .15s;
  }
  input[type="range"]::-webkit-slider-thumb:hover{
    box-shadow:0 0 16px rgba(139,92,246,0.45),0 0 6px rgba(139,92,246,0.3);
    transform:scale(1.08);
  }
  input[type="range"]::-moz-range-thumb{
    width:20px;height:20px;border-radius:50%;background:var(--accent);
    box-shadow:0 0 10px rgba(139,92,246,0.35);cursor:pointer;border:2px solid rgba(167,139,250,0.35);
  }

  .param-tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:1px}
  .param-tags .tag{font-size:10px;padding:2px 7px;border-radius:8px;background:rgba(255,255,255,.03);color:var(--dim);cursor:pointer;border:1px solid transparent;transition:.2s;white-space:nowrap}
  .param-tags .tag:hover{border-color:var(--accent);color:var(--accent)}
  .param-tags .tag.active{background:rgba(139,92,246,.12);border-color:var(--accent);color:var(--accent-bright)}

  .waveform-container{position:relative;width:100%;height:60px;background:rgba(0,0,0,.25);border-radius:8px;overflow:hidden;border:1px solid rgba(139,92,246,0.06)}
  .waveform-container canvas{width:100%;height:100%;display:block}
  .waveform-placeholder{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--dim);font-size:11px}

  .actions{display:flex;gap:6px;flex-wrap:wrap}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:5px;padding:9px 12px;font-size:12px;font-weight:600;border-radius:10px;border:1px solid transparent;cursor:pointer;transition:.25s;font-family:inherit;white-space:nowrap;flex:1;min-width:0}
  .btn:disabled{opacity:.3;cursor:not-allowed}
  .btn svg{width:14px;height:14px;stroke:currentColor;stroke-width:2;fill:none;flex-shrink:0}
  .btn-primary{background:linear-gradient(135deg,#8b5cf6,#7c3aed);color:#fff;box-shadow:0 2px 16px rgba(139,92,246,0.25)}
  .btn-primary:hover:not(:disabled){background:linear-gradient(135deg,#a78bfa,#8b5cf6);box-shadow:0 4px 24px rgba(139,92,246,0.35);transform:translateY(-1px)}
  .btn-secondary{background:rgba(255,255,255,.04);color:var(--text);border-color:rgba(255,255,255,.08)}
  .btn-secondary:hover:not(:disabled){background:rgba(255,255,255,.08);border-color:rgba(139,92,246,0.18)}
  .btn-sm{padding:8px 10px;font-size:11px}

  @keyframes btnPulse{
    0%,100%{box-shadow:0 0 0 0 rgba(139,92,246,0);border-color:rgba(255,255,255,.08)}
    50%{box-shadow:0 0 12px 2px rgba(139,92,246,0.25);border-color:rgba(139,92,246,0.4)}
  }
  .btn-playing{
    animation:btnPulse 1.5s ease-in-out infinite;
    background:rgba(139,92,246,.1) !important;
    color:var(--accent-bright) !important;
  }

  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:rgba(30,30,50,0.95);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--border);padding:10px 20px;border-radius:10px;font-size:12px;font-weight:500;opacity:0;pointer-events:none;transition:opacity .3s;z-index:100;max-width:90vw;text-align:center;box-shadow:0 4px 20px rgba(0,0,0,0.3)}
  .toast.show{opacity:1}
  .toast.error{border-color:var(--danger);color:var(--danger)}
  .toast.success{border-color:var(--success);color:var(--success)}

  .install-banner{display:none;background:rgba(139,92,246,.08);border:1px solid var(--accent);border-radius:10px;padding:10px 14px;text-align:center;cursor:pointer;font-size:12px;font-weight:600;color:var(--accent-bright)}
  .install-banner.show{display:block}

  #vizCanvas{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none;opacity:.85}

  @media(min-width:600px){.app{padding:12px 20px;gap:8px}.card{padding:14px 18px}.btn{flex:none}.header{padding:12px 18px}}
</style>
</head>
<body>
<canvas id="vizCanvas"></canvas>

<div class="app">
  <div class="card header">
    <h1>回声效果器</h1>
  </div>

  <div class="card upload-zone" id="uploadZone">
    <span class="icon"><svg viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg></span>
    <div class="label">点击选择或拖入音频文件</div>
    <div class="hint">WAV / MP3 / FLAC / AAC / OGG</div>
    <input type="file" id="fileInput" accept="audio/*">
  </div>

  <div class="card install-banner" id="installBanner">添加到主屏幕，像 App 一样使用</div>

  <div class="card file-info" id="fileInfo" style="display:none">
    <svg class="file-icon" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
    <span class="name" id="fileName"></span>
    <span class="meta" id="fileMeta"></span>
    <span class="remove" id="removeFile">&#10005;</span>
  </div>

  <div class="card params" id="paramPanel" style="display:none">
    <div class="presets" id="presetPanel">
      <button class="preset-btn" data-delay="50" data-decay="30">Slapback</button>
      <button class="preset-btn" data-delay="120" data-decay="40">Room</button>
      <button class="preset-btn" data-delay="250" data-decay="35">Hall</button>
      <button class="preset-btn" data-delay="400" data-decay="25">Deep</button>
    </div>
    <div class="param-row">
      <div class="param-label"><span>延迟 D</span><span class="value" id="delayDisplay">120 ms</span></div>
      <input type="range" id="delaySlider" min="1" max="500" value="120" step="1">
    </div>
    <div class="param-row">
      <div class="param-label"><span>衰减 &#945;</span><span class="value" id="decayDisplay">0.50</span></div>
      <input type="range" id="decaySlider" min="1" max="95" value="50" step="1">
      <div class="param-tags">
        <span class="tag" data-decay="3">极轻 0.03</span>
        <span class="tag" data-decay="10">轻微 0.10</span>
        <span class="tag" data-decay="30">适中 0.30</span>
        <span class="tag" data-decay="60">明显 0.60</span>
      </div>
    </div>
    <div class="waveform-container" id="wfContainer">
      <canvas id="wfCanvas"></canvas>
      <div class="waveform-placeholder" id="wfPlaceholder">波形加载中…</div>
    </div>
  </div>

  <div class="actions" id="actionBar" style="display:none">
    <button class="btn btn-secondary btn-sm" id="btnPlayOrig" disabled><svg viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3" fill="currentColor" stroke="none"/></svg> 原音</button>
    <button class="btn btn-secondary btn-sm" id="btnPlayEcho" disabled><svg viewBox="0 0 24 24"><path d="M11 5L6 9H2v6h4l5 4V5z" fill="currentColor" stroke="none"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg> 回声</button>
    <button class="btn btn-primary btn-sm" id="btnDownload" disabled><svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg> 下载</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const uploadZone=document.getElementById('uploadZone');
const fileInput=document.getElementById('fileInput');
const fileInfo=document.getElementById('fileInfo');
const fileName=document.getElementById('fileName');
const fileMeta=document.getElementById('fileMeta');
const removeFile=document.getElementById('removeFile');
const paramPanel=document.getElementById('paramPanel');
const actionBar=document.getElementById('actionBar');
const delaySlider=document.getElementById('delaySlider');
const decaySlider=document.getElementById('decaySlider');
const delayDisplay=document.getElementById('delayDisplay');
const decayDisplay=document.getElementById('decayDisplay');
const btnPlayOrig=document.getElementById('btnPlayOrig');
const btnPlayEcho=document.getElementById('btnPlayEcho');
const btnDownload=document.getElementById('btnDownload');
const wfCanvas=document.getElementById('wfCanvas');
const wfPlaceholder=document.getElementById('wfPlaceholder');
const installBanner=document.getElementById('installBanner');
const toastEl=document.getElementById('toast');

let audioBuffer=null;
let audioCtx=null;
let analyserNode=null;
let currentSource=null;
let echoNodes=[];
let filename='';
let channels=1;
let sampleRate=0;
let duration=0;
let vizActive=false;
let vizAnimId=null;
let barHeights=null;

function getAC(){
  if(!audioCtx){
    audioCtx=new(window.AudioContext||window.webkitAudioContext)();
    analyserNode=audioCtx.createAnalyser();
    analyserNode.fftSize=128;
    analyserNode.smoothingTimeConstant=0.82;
    analyserNode.connect(audioCtx.destination);
  }
  return audioCtx;
}
function stopPlayback(){
  if(currentSource){try{currentSource.stop()}catch(e){}currentSource.disconnect();currentSource=null}
  for(const n of echoNodes){try{n.disconnect()}catch(e){}}
  echoNodes=[];
  vizActive=false;
  btnPlayOrig.classList.remove('btn-playing');
  btnPlayEcho.classList.remove('btn-playing');
}

function showToast(msg,type=''){
  toastEl.textContent=msg;toastEl.className='toast show '+type;
  clearTimeout(toastEl._t);toastEl._t=setTimeout(()=>toastEl.className='toast',3000);
}

// ─── 文件处理 ────────────────────────────────────────
function handleFile(file){
  if(!file)return;
  stopPlayback();
  const reader=new FileReader();
  reader.onload=function(){
    showToast('解码中…');
    getAC().decodeAudioData(reader.result).then(function(buf){
      audioBuffer=buf;
      sampleRate=buf.sampleRate;
      channels=buf.numberOfChannels;
      duration=buf.duration;
      filename=file.name;
      fileName.textContent=file.name;
      fileMeta.textContent=sampleRate+'Hz · '+channels+'ch · '+duration.toFixed(1)+'s';
      fileInfo.style.display='flex';
      paramPanel.style.display='flex';
      actionBar.style.display='flex';
      btnPlayOrig.disabled=false;
      btnPlayEcho.disabled=false;
      btnDownload.disabled=false;
      drawWaveform();
      showToast('加载成功','success');
    }).catch(function(e){
      showToast('解码失败: '+e.message,'error');
      resetUI();
    });
  };
  reader.onerror=function(){showToast('读取文件失败','error')};
  reader.readAsArrayBuffer(file);
}

function resetUI(){
  stopPlayback();
  audioBuffer=null;
  fileInfo.style.display='none';
  paramPanel.style.display='none';
  actionBar.style.display='none';
  btnPlayOrig.disabled=true;btnPlayEcho.disabled=true;btnDownload.disabled=true;
  wfPlaceholder.style.display='flex';
  clearCanvas();
}

// ─── 波形 ────────────────────────────────────────────
function drawWaveform(){
  if(!audioBuffer){clearCanvas();return}
  const buf=audioBuffer;
  const data=buf.getChannelData(0);
  const n=data.length;
  const target=Math.min(n,1200);
  const step=Math.max(1,Math.floor(n/target));
  const canvas=wfCanvas;
  const dpr=window.devicePixelRatio||1;
  const rect=canvas.parentElement.getBoundingClientRect();
  canvas.width=rect.width*dpr;canvas.height=rect.height*dpr;
  canvas.style.width=rect.width+'px';canvas.style.height=rect.height+'px';
  const ctx=canvas.getContext('2d');ctx.scale(dpr,dpr);
  const w=rect.width,h=rect.height,mid=h/2;
  ctx.clearRect(0,0,w,h);
  ctx.beginPath();ctx.moveTo(0,mid);
  for(let i=0;i<target;i++){const idx=i*step;const x=i/(target-1)*w;const y=mid+data[idx]*mid*.9;ctx.lineTo(x,y)}
  for(let i=target-1;i>=0;i--){const idx=i*step;const x=i/(target-1)*w;const y=mid-data[idx]*mid*.9;ctx.lineTo(x,y)}
  ctx.closePath();
  const g=ctx.createLinearGradient(0,0,0,h);g.addColorStop(0,'rgba(139,92,246,.2)');g.addColorStop(.5,'rgba(139,92,246,.45)');g.addColorStop(1,'rgba(139,92,246,.2)');
  ctx.fillStyle=g;ctx.fill();
  ctx.strokeStyle='rgba(139,92,246,.35)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(0,mid);ctx.lineTo(w,mid);ctx.stroke();
  wfPlaceholder.style.display='none';
}
function clearCanvas(){
  const canvas=wfCanvas;const dpr=window.devicePixelRatio||1;const rect=canvas.parentElement.getBoundingClientRect();
  canvas.width=rect.width*dpr;canvas.height=rect.height*dpr;canvas.style.width=rect.width+'px';canvas.style.height=rect.height+'px';
  canvas.getContext('2d').scale(dpr,dpr);canvas.getContext('2d').clearRect(0,0,rect.width,rect.height);
}

// ─── 三次回声 DSP ────────────────────────────────────
function createEchoNodes(ac,delayMs,decay){
  const D=delayMs/1000;
  const d1=ac.createDelay(5);d1.delayTime.value=D;
  const g1=ac.createGain();g1.gain.value=decay;
  const d2=ac.createDelay(5);d2.delayTime.value=D;
  const g2=ac.createGain();g2.gain.value=decay;
  const d3=ac.createDelay(5);d3.delayTime.value=D;
  const g3=ac.createGain();g3.gain.value=decay;
  d1.connect(g1);g1.connect(d2);d2.connect(g2);g2.connect(d3);d3.connect(g3);
  return [d1,g1,d2,g2,d3,g3];
}

function playEcho(delayMs,decay){
  if(!audioBuffer)return;
  stopPlayback();
  const ac=getAC();
  const src=ac.createBufferSource();src.buffer=audioBuffer;
  const [d1,g1,d2,g2,d3,g3]=createEchoNodes(ac,delayMs,decay);
  echoNodes=[d1,g1,d2,g2,d3,g3];
  // y[n] = x[n] + α·x[n-D] + α²·x[n-2D] + α³·x[n-3D]
  src.connect(analyserNode); // dry → analyser → destination
  src.connect(d1);d1.connect(g1);g1.connect(d2);d2.connect(g2);g2.connect(d3);d3.connect(g3);g3.connect(analyserNode); // wet
  currentSource=src;
  src.onended=function(){if(currentSource===src)currentSource=null;vizActive=false;btnPlayEcho.classList.remove('btn-playing');try{d1.disconnect();g1.disconnect();d2.disconnect();g2.disconnect();d3.disconnect();g3.disconnect()}catch(e){}};
  src.start();
  vizActive=true;
  btnPlayEcho.classList.add('btn-playing');
  startViz();
}

function playOriginal(){
  if(!audioBuffer)return;
  stopPlayback();
  const ac=getAC();const src=ac.createBufferSource();src.buffer=audioBuffer;
  src.connect(analyserNode);currentSource=src;
  src.onended=function(){if(currentSource===src)currentSource=null;vizActive=false;btnPlayOrig.classList.remove('btn-playing')};
  src.start();
  vizActive=true;
  btnPlayOrig.classList.add('btn-playing');
  startViz();
}

// ─── 下载 ────────────────────────────────────────────
function downloadEcho(delayMs,decay){
  if(!audioBuffer)return;
  btnDownload.disabled=true;btnDownload.innerHTML='<svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg> 处理中…';
  const length=audioBuffer.length;
  const sr=audioBuffer.sampleRate;
  const ch=audioBuffer.numberOfChannels;

  const offline=new OfflineAudioContext(ch,length,sr);
  const src=offline.createBufferSource();src.buffer=audioBuffer;
  const [d1,g1,d2,g2,d3,g3]=createEchoNodes(offline,delayMs,decay);
  src.connect(offline.destination);
  src.connect(d1);d1.connect(g1);g1.connect(d2);d2.connect(g2);g2.connect(d3);d3.connect(g3);g3.connect(offline.destination);
  src.start(0);

  offline.startRendering().then(function(rendered){
    const wav=audioBufferToWav(rendered);
    const blob=new Blob([wav],{type:'audio/wav'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');a.href=url;
    a.download=filename.replace(/\.[^.]+$/,'')+'_echo_d'+delayMs+'_a'+Math.round(decay*100)+'.wav';
    document.body.appendChild(a);a.click();document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showToast('下载完成','success');
  }).catch(function(e){showToast('渲染失败: '+e.message,'error')}).finally(function(){
    btnDownload.disabled=false;btnDownload.innerHTML='<svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg> 下载';
  });
}

function audioBufferToWav(buffer){
  const numChannels=buffer.numberOfChannels,sampleRate=buffer.sampleRate;
  const format=1,bitDepth=16;
  const bytesPerSample=bitDepth/8,blockAlign=numChannels*bytesPerSample;
  const dataLength=buffer.length*blockAlign;
  const headerLength=44;
  const totalLength=headerLength+dataLength;
  const arrayBuffer=new ArrayBuffer(totalLength);
  const view=new DataView(arrayBuffer);
  function writeString(offset,str){for(let i=0;i<str.length;i++)view.setUint8(offset+i,str.charCodeAt(i))}
  writeString(0,'RIFF');view.setUint32(4,totalLength-8,true);writeString(8,'WAVE');
  writeString(12,'fmt ');view.setUint32(16,16,true);view.setUint16(20,format,true);
  view.setUint16(22,numChannels,true);view.setUint32(24,sampleRate,true);
  view.setUint32(28,sampleRate*blockAlign,true);view.setUint16(32,blockAlign,true);
  view.setUint16(34,bitDepth,true);writeString(36,'data');view.setUint32(40,dataLength,true);
  let offset=44;
  const channels=[];for(let c=0;c<numChannels;c++)channels.push(buffer.getChannelData(c));
  for(let i=0;i<buffer.length;i++){for(let c=0;c<numChannels;c++){
    let sample=Math.max(-1,Math.min(1,channels[c][i]));
    sample=sample<0?sample*0x8000:sample*0x7FFF;
    view.setInt16(offset,sample,true);offset+=2;
  }}
  return arrayBuffer;
}

// ─── 背景可视化 ──────────────────────────────────────
const vizCanvas=document.getElementById('vizCanvas');
const vizCtx=vizCanvas.getContext('2d');
const BAR_COUNT=48;
const LERP_SPEED=0.13;
const FADE_SPEED=0.04;

// ─── 粒子系统 ────────────────────────────────────────
const PARTICLE_COUNT=15;
const particles=[];
let vizTime=0;

function initParticles(w,h){
  particles.length=0;
  for(let i=0;i<PARTICLE_COUNT;i++){
    particles.push({
      x:Math.random()*w,
      y:Math.random()*h,
      vx:(Math.random()-0.5)*0.12,
      vy:-(0.1+Math.random()*0.25),
      size:1+Math.random()*1.5,
      alpha:0.04+Math.random()*0.08,
      hue:Math.random()<0.4?0:Math.random()<0.7?1:2,
      phase:Math.random()*Math.PI*2
    });
  }
}

function updateAndDrawParticles(w,h,dt){
  vizTime+=dt;
  for(let i=0;i<particles.length;i++){
    const p=particles[i];
    p.x+=p.vx+Math.sin(vizTime*0.001+p.phase)*0.15;
    p.y+=p.vy;
    if(p.y<-10){
      p.y=h+10;
      p.x=Math.random()*w;
    }
    if(p.x<-10)p.x=w+10;
    if(p.x>w+10)p.x=-10;

    let r,g,b;
    if(p.hue===0){r=167;g=139;b=250}
    else if(p.hue===1){r=99;g=102;b=241}
    else{r=255;g=255;b=255}

    const glowR=p.size*3;
    const grad=vizCtx.createRadialGradient(p.x,p.y,0,p.x,p.y,glowR);
    grad.addColorStop(0,'rgba('+r+','+g+','+b+','+p.alpha+')');
    grad.addColorStop(0.4,'rgba('+r+','+g+','+b+','+(p.alpha*0.4)+')');
    grad.addColorStop(1,'rgba('+r+','+g+','+b+',0)');
    vizCtx.fillStyle=grad;
    vizCtx.beginPath();
    vizCtx.arc(p.x,p.y,glowR,0,Math.PI*2);
    vizCtx.fill();
  }
}

function resizeViz(){
  const dpr=window.devicePixelRatio||1;
  vizCanvas.width=window.innerWidth*dpr;
  vizCanvas.height=window.innerHeight*dpr;
  vizCtx.scale(dpr,dpr);
  if(!barHeights)barHeights=new Float32Array(BAR_COUNT);
  initParticles(window.innerWidth,window.innerHeight);
}
resizeViz();
window.addEventListener('resize',resizeViz);

function startViz(){
  if(vizAnimId)return;
  if(!barHeights)barHeights=new Float32Array(BAR_COUNT);
  vizAnimId=requestAnimationFrame(renderViz);
}

let lastVizTime=0;
function renderViz(timestamp){
  const w=window.innerWidth;
  const h=window.innerHeight;
  const dt=lastVizTime?timestamp-lastVizTime:16;
  lastVizTime=timestamp;

  vizCtx.clearRect(0,0,w,h);

  // ── Layer 1: Ambient particles (always drawn) ──
  updateAndDrawParticles(w,h,dt);

  // ── Layer 2: Frequency bars ──
  let anyActive=false;
  if(analyserNode){
    const freqData=new Uint8Array(analyserNode.frequencyBinCount);
    analyserNode.getByteFrequencyData(freqData);

    const usableBins=Math.floor(freqData.length*0.75);
    const binsPerBar=Math.max(1,Math.floor(usableBins/BAR_COUNT));

    for(let i=0;i<BAR_COUNT;i++){
      let sum=0;
      const startBin=Math.floor(i*usableBins/BAR_COUNT);
      for(let b=0;b<binsPerBar&&startBin+b<usableBins;b++){
        sum+=freqData[startBin+b];
      }
      const target=(sum/binsPerBar)/255;

      if(vizActive){
        barHeights[i]+=(target-barHeights[i])*LERP_SPEED;
      }else{
        barHeights[i]*=(1-FADE_SPEED);
      }

      if(barHeights[i]>0.005)anyActive=true;

      const barH=barHeights[i]*h*0.35;
      if(barH<1)continue;

      const gap=2;
      const barW=(w/BAR_COUNT)-gap;
      const x=i*(barW+gap)+gap/2;
      const y=h-barH;

      const grad=vizCtx.createLinearGradient(x,h,x,y);
      const alpha=barHeights[i]*0.22;
      grad.addColorStop(0,'rgba(139,92,246,'+alpha*0.3+')');
      grad.addColorStop(0.3,'rgba(139,92,246,'+alpha*0.7+')');
      grad.addColorStop(0.7,'rgba(99,102,241,'+alpha*0.5+')');
      grad.addColorStop(1,'rgba(99,102,241,0)');

      vizCtx.fillStyle=grad;

      const r=Math.min(barW/2,4);
      vizCtx.beginPath();
      vizCtx.moveTo(x,h);
      vizCtx.lineTo(x,y+r);
      vizCtx.quadraticCurveTo(x,y,x+r,y);
      vizCtx.lineTo(x+barW-r,y);
      vizCtx.quadraticCurveTo(x+barW,y,x+barW,y+r);
      vizCtx.lineTo(x+barW,h);
      vizCtx.closePath();
      vizCtx.fill();
    }

    // ── Layer 3: Bass-reactive center glow ──
    if(vizActive||anyActive){
      if(barHeights){
        const glowAlpha=barHeights[0]*0.08;
        if(glowAlpha>0.002){
          const grd=vizCtx.createRadialGradient(w/2,h*0.85,0,w/2,h*0.85,w*0.5);
          grd.addColorStop(0,'rgba(139,92,246,'+glowAlpha+')');
          grd.addColorStop(0.5,'rgba(99,102,241,'+glowAlpha*0.3+')');
          grd.addColorStop(1,'rgba(99,102,241,0)');
          vizCtx.fillStyle=grd;
          vizCtx.fillRect(0,0,w,h);
        }
      }
    }
  }

  // Continue animation (particles always run, bars fade out)
  if(vizActive||anyActive){
    vizAnimId=requestAnimationFrame(renderViz);
  }else{
    // Keep particles alive even when audio stops - ambient mode
    vizAnimId=requestAnimationFrame(renderViz);
  }
}

// Start ambient particles on load
startViz();

// ─── 滑块轨道填充 ────────────────────────────────────
function updateSliderFill(slider){
  const min=parseFloat(slider.min);
  const max=parseFloat(slider.max);
  const val=parseFloat(slider.value);
  const pct=((val-min)/(max-min))*100;
  slider.style.background='linear-gradient(to right,rgba(139,92,246,0.4) 0%,rgba(139,92,246,0.4) '+pct+'%,rgba(255,255,255,0.07) '+pct+'%,rgba(255,255,255,0.07) 100%)';
}
updateSliderFill(delaySlider);
updateSliderFill(decaySlider);

document.querySelectorAll('.preset-btn').forEach(function(btn){
  btn.addEventListener('click',function(){
    delaySlider.value=this.dataset.delay;
    decaySlider.value=this.dataset.decay;
    delaySlider.dispatchEvent(new Event('input'));
    decaySlider.dispatchEvent(new Event('input'));
    document.querySelectorAll('.preset-btn').forEach(function(b){b.classList.remove('active')});
    this.classList.add('active');
    // Clear active tag since preset overrides
    document.querySelectorAll('.param-tags .tag').forEach(function(t){t.classList.remove('active')});
  });
});

uploadZone.addEventListener('drop',e=>{
  e.preventDefault();uploadZone.classList.remove('drag-over');

});
removeFile.addEventListener('click',e=>{e.stopPropagation();resetUI()});

delaySlider.addEventListener('input',()=>{delayDisplay.textContent=delaySlider.value+' ms';updateSliderFill(delaySlider);clearActivePreset()});
decaySlider.addEventListener('input',()=>{decayDisplay.textContent=(decaySlider.value/100).toFixed(2);updateSliderFill(decaySlider);clearActivePreset()});
document.querySelectorAll('.param-tags .tag').forEach(t=>{
  t.addEventListener('click',function(){
    decaySlider.value=this.dataset.decay;decaySlider.dispatchEvent(new Event('input'));
    document.querySelectorAll('.param-tags .tag').forEach(x=>x.classList.remove('active'));
    this.classList.add('active');
  });

function clearActivePreset(){
  document.querySelectorAll('.preset-btn').forEach(function(b){b.classList.remove('active')});
}

});
